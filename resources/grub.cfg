set timeout=5
set default=0

# Graphics mode for framebuffer
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=1024x768x32
    set gfxpayload=keep
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
fi

menuentry "MyOS" {
    insmod part_msdos
    insmod part_gpt
    insmod ext2
    multiboot /boot/kernel.elf
    boot
}

menuentry "MyOS (Multiboot2)" {
    insmod part_msdos
    insmod part_gpt
    insmod ext2
    multiboot2 /boot/kernel.elf
    boot
}

menuentry "MyOS (Text Mode)" {
    insmod part_msdos
    insmod part_gpt
    insmod ext2
    set gfxpayload=text
    multiboot /boot/kernel.elf
    boot
}
