set timeout=5
set default=0

# Graphics mode for framebuffer
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=1024x768x32
    set gfxpayload=keep
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
fi

if [ "$grub_platform" = "efi" ]; then
    menuentry "MyOS (UEFI Chainload)" {
        insmod part_msdos
        insmod part_gpt
        insmod fat
        insmod chain
        search --no-floppy --file --set=root /EFI/myos/myos.efi
        chainloader /EFI/myos/myos.efi
        boot
    }
fi

if [ "$grub_platform" = "pc" ]; then
    menuentry "MyOS (Multiboot - BIOS)" {
        insmod part_msdos
        insmod part_gpt
        insmod ext2
        multiboot /boot/kernel.elf
        boot
    }
fi

menuentry "System Info" {
    echo "GRUB Platform: $grub_platform"
    sleep 5
}
